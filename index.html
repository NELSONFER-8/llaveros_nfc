<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Llavero NFC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    h2, h3 { text-align: center; color: #ffffff; margin-top: 0; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    .badge-disponible { background-color: #27ae60; color: #fff; }
    .badge-asignado { background-color: #2980b9; color: #fff; }
    .field-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 15px;
    }
    input:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-primary { background-color: #f39c12; color: #121212; }
    .btn-secondary { background-color: #3498db; color: #fff; }
    .btn-admin { background-color: #e74c3c; color: #fff; }
    .admin-panel {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #333;
    }
    /* Estilos del Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #2a2a2a;
      width: 90%;
      max-width: 500px;
      padding: 20px;
      border-radius: 10px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      background: #e74c3c; color: white;
      border: none; padding: 5px 10px;
      border-radius: 4px; cursor: pointer;
    }
    .viewer-container {
      margin-top: 15px;
      width: 100%;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      border-radius: 8px;
      overflow: hidden;
    }
    #statusMsg { font-family: monospace; font-size: 13px; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Llavero NFC</h2>
  
  <div style="text-align: center;">
    <span id="estadoBadge" class="badge badge-disponible">Cargando...</span>
  </div>

  <div class="field-group">
    <label>Código Único:</label>
    <input type="text" id="txtCodigo" disabled value="-------">
  </div>

  <div class="field-group">
    <label>Propietario:</label>
    <input type="text" id="txtPropietario" disabled placeholder="Sin asignar">
  </div>

  <div class="field-group">
    <label>Teléfono de Contacto:</label>
    <input type="tel" id="txtTelefono" disabled placeholder="Sin registrar">
  </div>

  <!-- Botón de consulta pública -->
  <button id="btnVerTarjeta" class="btn btn-secondary" style="display: none;">Ver Tarjeta de Circulación</button>

  <!-- Panel de Edición/Administración -->
  <div class="admin-panel">
    <h3>Gestión Administrativa</h3>
    <button id="btnLogin" class="btn btn-admin">Iniciar Sesión con Google</button>

    <form id="adminForm" style="display: none; margin-top: 15px;">
      <div class="field-group">
        <label for="editPropietario">Editar Propietario:</label>
        <input type="text" id="editPropietario" required>
      </div>
      <div class="field-group">
        <label for="editTelefono">Editar Teléfono:</label>
        <input type="tel" id="editTelefono" required>
      </div>
      <div class="field-group">
        <label for="fileInput">Subir/Cambiar Tarjeta (Imagen o PDF):</label>
        <input type="file" id="fileInput" accept="image/*,application/pdf" style="margin-top: 5px;">
      </div>
      <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    </form>
  </div>

  <p id="statusMsg"></p>
</div>

<!-- Modal para Visualización de Tarjeta de Circulación -->
<div id="modalTarjeta" class="modal">
  <div class="modal-content">
    <button class="close-btn" id="btnCerrarModal">X Cerrar</button>
    <h3>Tarjeta de Circulación</h3>
    <div id="contenedorTarjeta" class="viewer-container"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  // Configuración de tu proyecto en Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyC7L72sP3vg9_OooIZhcU8Ry0rgqFVz7tQ",
    authDomain: "llaveros-nfc-5ebe2.firebaseapp.com",
    projectId: "llaveros-nfc-5ebe2",
    storageBucket: "llaveros-nfc-5ebe2.firebasestorage.app",
    messagingSenderId: "752383020507",
    appId: "1:752383020507:web:63015585ab4bfc5b3debfe"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const storage = getStorage(app);

  let tarjetaUrlGlobal = null;
  let tipoDocumentoGlobal = null;

  // Extraer el ID desde los parámetros de la URL (ej: ?id=K9x2M8pL)
  const urlParams = new URLSearchParams(window.location.search);
  const llaveroId = urlParams.get('id') || "K9x2M8pL"; // 'K9x2M8pL' como ID fallback

  const statusMsg = document.getElementById('statusMsg');

  // 1. CARGAR DATOS DEL LLAVERO (Público)
  async function cargarLlavero() {
    try {
      const docSnap = await getDoc(doc(db, "llaveros", llaveroId));
      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById('txtCodigo').value = data.codigo || llaveroId;
        document.getElementById('txtPropietario').value = data.propietario || "No asignado";
        document.getElementById('txtTelefono').value = data.telefonoContacto || "No registrado";
        
        // Asignación de Badge
        const estadoBadge = document.getElementById('estadoBadge');
        estadoBadge.innerText = data.estado || "disponible";
        estadoBadge.className = `badge badge-${data.estado === 'asignado' ? 'asignado' : 'disponible'}`;

        // Datos para el visor de tarjeta
        tarjetaUrlGlobal = data.tarjetaCirculacionUrl || null;
        tipoDocumentoGlobal = data.tipoDocumento || null;

        if (tarjetaUrlGlobal) {
          document.getElementById('btnVerTarjeta').style.display = 'block';
        }

        // Rellenar formulario de administración
        document.getElementById('editPropietario').value = data.propietario || "";
        document.getElementById('editTelefono').value = data.telefonoContacto || "";
      } else {
        statusMsg.innerText = "❌ El llavero escaneado no existe.";
      }
    } catch (err) {
      console.error(err);
      statusMsg.innerText = "Error al leer datos: " + err.message;
    }
  }

  // 2. VISUALIZADOR HÍBRIDO (Imagen o PDF)
  function renderizarDocumento(url, tipoMime) {
    const contenedor = document.getElementById('contenedorTarjeta');
    if (!url) {
      contenedor.innerHTML = '<p style="color:#888;">No hay tarjeta cargada.</p>';
      return;
    }

    const urlLimpia = url.toLowerCase();
    const esImagen = (tipoMime && tipoMime.startsWith('image/')) || 
                     urlLimpia.includes('.png') || 
                     urlLimpia.includes('.jpg') || 
                     urlLimpia.includes('.jpeg') || 
                     urlLimpia.includes('.webp');

    if (esImagen) {
      contenedor.innerHTML = `
        <img src="${url}" alt="Tarjeta de Circulación" style="width: 100%; height: auto; max-height: 70vh; object-fit: contain;">
      `;
    } else {
      // Motor embebido para renderizado directo en móviles sin forzar descarga
      contenedor.innerHTML = `
        <iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true" 
                style="width: 100%; height: 60vh; border: none;" allowfullscreen>
        </iframe>
      `;
    }
  }

  // Eventos del Modal
  document.getElementById('btnVerTarjeta').addEventListener('click', () => {
    renderizarDocumento(tarjetaUrlGlobal, tipoDocumentoGlobal);
    document.getElementById('modalTarjeta').style.display = 'flex';
  });

  document.getElementById('btnCerrarModal').addEventListener('click', () => {
    document.getElementById('modalTarjeta').style.display = 'none';
  });

  // 3. AUTENTICACIÓN CON GOOGLE
  document.getElementById('btnLogin').addEventListener('click', () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider).catch(err => {
      statusMsg.innerText = "Error de autenticación: " + err.message;
    });
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('btnLogin').style.display = 'none';
      document.getElementById('adminForm').style.display = 'block';
      statusMsg.innerText = "Sesión activa: " + user.email;
    } else {
      document.getElementById('btnLogin').style.display = 'block';
      document.getElementById('adminForm').style.display = 'none';
    }
  });

  // 4. GUARDAR / EDITAR REGISTRO (Solo Autenticados)
  document.getElementById('adminForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.innerText = "Guardando cambios...";

    const propietario = document.getElementById('editPropietario').value;
    const telefono = document.getElementById('editTelefono').value;
    const fileInput = document.getElementById('fileInput');

    try {
      let finalUrl = tarjetaUrlGlobal;
      let finalTipo = tipoDocumentoGlobal;

      // Si subió un nuevo archivo, procesarlo en Firebase Storage
      if (fileInput.files[0]) {
        const file = fileInput.files[0];
        const storageRef = ref(storage, `llaveros/${llaveroId}_tarjeta`);
        
        // Metadatos para forzar apertura inline
        const metadata = {
          contentType: file.type,
          contentDisposition: 'inline'
        };

        await uploadBytes(storageRef, file, metadata);
        finalUrl = await getDownloadURL(storageRef);
        finalTipo = file.type;
      }

      // Actualizar datos en Firestore
      await setDoc(doc(db, "llaveros", llaveroId), {
        codigo: llaveroId,
        propietario: propietario,
        telefonoContacto: telefono,
        estado: "asignado",
        tarjetaCirculacionUrl: finalUrl,
        tipoDocumento: finalTipo,
        fechaActualizacion: new Date().toISOString()
      }, { merge: true });

      statusMsg.innerText = "✅ Guardado correctamente.";
      cargarLlavero(); // Recargar datos
    } catch (err) {
      console.error(err);
      statusMsg.innerText = "❌ Error al guardar: " + err.message;
    }
  });

  // Inicializar lectura
  cargarLlavero();
</script>

</body>
</html>
